name: Trigger GitLab CTests Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (use 0 for develop branch)'
        required: true
        type: string

jobs:
  trigger-gitlab-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR_NUM=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "PR_NUM=${{ github.event.inputs.pr_number }}" >> $GITHUB_ENV
          else
            echo "PR_NUM=0" >> $GITHUB_ENV
          fi
          
      - name: Trigger GitLab Pipeline
        run: |
          # Important note: This token should be a proper GitLab Pipeline Trigger token
          # created via Settings > CI/CD > Pipeline triggers in your GitLab project
          curl --verbose --request POST \
            --form "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            --form "ref=ci_gitlab_pipelines_dev" \
            --form "variables[WEBHOOK_TRIGGER]=ctests" \
            --form "variables[PR_NUMBER]=${{ env.PR_NUM }}" \
            --form "variables[GITHUB_REPO_URL]=https://github.com/NOAA-EMC/global-workflow" \
            "https://vlab.noaa.gov/gitlab-licensed/api/v4/projects/185/trigger/pipeline"
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}