#
name: bash_code_anl
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash -o pipefail {0}

jobs:

  shfmt:
    runs-on: ubuntu-22.04

    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # to get PR metadata
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: shfmt scan
        uses: reviewdog/action-shfmt@v1.0.4

  shellcheck:
    runs-on: ubuntu-22.04

    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # to get PR metadata
      security-events: write

    steps:    
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Shellcheck Scan
        uses: reactive-firewall/shellcheck-scan@v1
        with:  # optional arguments
          # match: '**/*.{sh,bash}'
          match: 'jobs/* dev/jobs/*.sh script/*.sh'
          shell-format: 'bash'
          publish-artifacts: true
        if: ${{ success() }}

      # # Keep old diff shellcheck for now until whole workflow is compliant
