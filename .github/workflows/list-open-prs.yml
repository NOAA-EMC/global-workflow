name: List Open Pull Requests

on:
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  list-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup GitHub CLI
        run: |
          gh --version || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List open PRs
        run: |
          echo "::group::Open Pull Requests"
          echo "PR Number | Title | Author | Created"
          echo "--------- | ----- | ------ | -------"
          
          # List open PRs with most recently updated first
          gh pr list --state open --sort updated --limit 20 --json number,title,author,createdAt \
            | jq -r '.[] | "| #\(.number) | \(.title) | @\(.author.login) | \(.createdAt | fromjson | .[0:10]) |"'
          
          echo ""
          echo "Use these PR numbers in the 'Trigger GitLab CTests Pipeline' workflow"
          echo "::endgroup::"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
