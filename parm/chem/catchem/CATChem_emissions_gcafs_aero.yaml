anthro1:
  #NO:
  #  long_name: "Nitrogen Oxide"
  #  units: "kg/m2/s"
  #  scale: [1.0]
  #  map: ["NO"]   #double check upper or lower case
  SO2:
    long_name: "Sulfur Dioxide"
    units: "kg/m2/s"
    scale: [0.97, 0.045] #1-0.03; 0.03*96/64
    map: ["so2", "so4"]
  OC:
    long_name: "Organic Carbon"
    units: "kg/m2/s"
    scale: [0.9, 0.9] #0.5 x 1.8; 0.5 is the fraction of OC that is hydrophobic/hydrophilic; 1.8 is the scaling factor from OC to POM
    map: ["oc1", "oc2"]
  BC:
    long_name: "Black Carbon"
    units: "kg/m2/s"
    scale: [0.8, 0.2] #There is no 1.8 factor for BC
    map: ["bc1", "bc2"]
anthro2:
  SO2_elev:
    long_name: "Sulfur Dioxide at Elevated Levels"
    units: "kg/m2/s"
    scale: [0.97, 0.045] #1-0.03; 0.03*96/64
    map: ["so2", "so4"]
  OC_elev:
