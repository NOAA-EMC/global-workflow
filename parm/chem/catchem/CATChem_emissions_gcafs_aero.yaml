    long_name: "Volcanic Sulfur Dioxide (degassing)"
    units: "kg/m2/s"
    scale: [2.0]   # file rate is kg S/s; 2.0 = fMassSO2/fMassSulfur (64/32) -> kg SO2/s
    map: ["so2"]
