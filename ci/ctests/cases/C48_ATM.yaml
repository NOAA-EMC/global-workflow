gfs_fcst:
  input_files:
    copy:
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_ctrl.nc, 
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_ctrl.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile1.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile1.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile2.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile2.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile3.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile3.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile4.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile4.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile5.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile5.nc]
      - [{{ STAGED_FUNCTIONAL_TEST_DIR }}/gdas.{{ PDY }}/{{ HH }}/atmos/input/gfs_data.tile6.nc
         {{RUNTESTS}}/{{test_name}}//gdas.{{PDY}}/{{HH}}/atmos/input/gfs_data.tile6.nc]

  output_files: use_jinja_template_fcst

gfs_atmos_pro:
  staged_datapath: {{ STAGED_FUNCTIONAL_TEST_DIR }}/{{ testcase }}/gfs_atmos_prod
  input_files: use_jinja_template_gfs_atmos_pro
  output_files: use_jinja_template_gfs_atmos_pro
