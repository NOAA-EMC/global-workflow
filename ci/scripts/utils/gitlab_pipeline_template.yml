# THIS FILE IS THE CORE TEMPLATE FOR THE GITLAB CI/CD PIPELINES

stages:
  - build
  - create_experiments
  - run_tests

variables:
  CI_RUN_PATH: ${CI_BUILDS_DIR}/${CI_COMMIT_SHORT_SHA}
  GIT_CLONE_PATH: '${CI_RUN_PATH}/global-workflow'
  HOMEGFS: ${GIT_CLONE_PATH}
  RUNTESTS_DIR: ${CI_RUN_PATH}/RUNTESTS
  GIT_DEPTH: 1
  RUNNER_SCRIPT_TIMEOUT: 6h
  RUNNER_AFTER_SCRIPT_TIMEOUT: 6h

.base_config:
  variables:
    GIT_STRATEGY: none

.build_template:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  stage: build
  allow_failure: true
  script:
    - echo "Using build directory ${HOMEGFS}"
    - ci/scripts/utils/ci_utils_wrapper.sh build_compute
    - sorc/link_workflow.sh
    - mkdir -p ${RUNTESTS_DIR}

.setup_template:
  extends: .base_config
  stage: create_experiments
  allow_failure: true
  script:
    - export RUNTESTS=${RUNTESTS_DIR}
    - ${HOMEGFS}/ci/scripts/utils/ci_utils_wrapper.sh create_experiment ${HOMEGFS}/ci/cases/pr/${caseName}.yaml
  dependencies:
    - build-${MACHINE}

.run_tests_template:
  extends: .base_config
  stage: run_tests
  allow_failure: true
  script:
    - echo "Using build directory $HOMEGFS (dated $BUILD_DATE)"
    - pslot=$(${HOMEGFS}/ci/scripts/utils/ci_utils_wrapper.sh get_pslot ${RUNTESTS_DIR} ${caseName})
    - ${HOMEGFS}/ci/scripts/run-check_ci.sh ${CI_RUN_PATH} ${pslot} global-workflow
  dependencies:
    - setup_experiments-${MACHINE}
