stages:
  - build
  - create_experiments
  - run_tests
  
variables:
  BUILD_DATE: 'today'
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/global-workflow-${BUILD_DATE}'
  HOMEGFS: $GIT_CLONE_PATH
  RUNTESTS_DIR: $CI_BUILDS_DIR/RUNTESTS
  GIT_DEPTH: 1
  RUNNER_SCRIPT_TIMEOUT: 6h
  RUNNER_AFTER_SCRIPT_TIMEOUT: 6h

build:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  
  stage: build
  script:
    - export CI_PROJECT_DIR=$HOMEGFS
    - echo "Using build directory ${HOMEGFS} (dated ${BUILD_DATE})"
    - ci/scripts/utils/ci_utils_wrapper.sh build_compute
    - sorc/link_workflow.sh
    - mkdir -p ${RUNTESTS_DIR}
  # NEED skip_ci_on_hosts to work (skipping for now)
  #  - source ${HOMEGFS}/workflow/gw_setup.sh
  #  - cases_on_host=$(${HOMEGFS}/ci/scripts/utils/get_host_case_list.py $MACHINE)
  #  - echo "cases_on_host=$cases_on_host" >> variables.env
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  #artifacts:
  #  reports:
  #    dotenv: variables.env
  tags:
    - ${MACHINE}


setup_experiments:
  variables:
    GIT_STRATEGY: none
  stage: create_experiments
  script:
    - ${HOMEGFS}/ci/scripts/utils/ci_utils_wrapper.sh create_experiment ${HOMEGFS}/ci/cases/pr/${caseName}.yaml
  #rules:
  #  - if: '$cases_on_host =~ /$caseName/'
  parallel:
    matrix:
      - caseName: ["C48_ATM", "C48mx500_3DVarAOWCDA", "C48mx500_hybAOWCDA", "C48_S2SWA_gefs", "C48_S2SW", "C96_atm3DVar", "C96C48_hybatmDA", "C96C48_hybatmaerosnowDA"]
  tags:
    - gaeac6
  dependencies:
    - build

run_tests:
  variables:
    GIT_STRATEGY: none
  stage: run_tests
  script:
    - echo "Using build directory ${HOMEGFS} (dated ${BUILD_DATE})"
    - pslot=$(${HOMEGFS}/ci/scripts/utils/ci_utils_wrapper.sh get_pslot ${RUNTESTS_DIR} ${caseName})
    - ${HOMEGFS}/ci/scripts/run-check_ci.sh ${CI_BUILDS_DIR} ${pslot} global-workflow-${BUILD_DATE}
  #rules:
  #  - if: '$cases_on_host =~ /$caseName/'
  parallel:
    matrix:
       - caseName: ["C48_ATM", "C48mx500_3DVarAOWCDA", "C48mx500_hybAOWCDA", "C48_S2SWA_gefs", "C48_S2SW", "C96_atm3DVar", "C96C48_hybatmDA", "C96C48_hybatmaerosnowDA"]
  tags:
    - gaeac6
  dependencies:
    - setup_experiments
