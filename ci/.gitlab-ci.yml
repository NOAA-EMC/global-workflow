stages:
  - build
  - create_experiments
  - run_tests
  
variables:
  BUILD_DATE: 'friday'
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/global-workflow-${BUILD_DATE}'
  HOMEGFS: $GIT_CLONE_PATH
  RUNTESTS_DIR: $CI_BUILDS_DIR/RUNTESTS
  GIT_DEPTH: 1

build:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  
  stage: build
  script:
    - export CI_PROJECT_DIR=$HOMEGFS
    - echo "Using build directory ${HOMEGFS} (dated ${BUILD_DATE})"
    - ci/scripts/utils/ci_utils_wrapper.sh build_compute
    - sorc/link_workflow.sh
    - mkdir -p ${RUNTESTS_DIR}
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  tags:
    - ${MACHINE}

setup:
  variables:
    GIT_STRATEGY: none
  stage: create_experiments
  script:
    - ${HOMEGFS}/ci/scripts/utils/ci_utils_wrapper.sh create_experiment ${HOMEGFS}/ci/cases/pr/${caseName}
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
      - caseName: ["C48_ATM", "C48mx500_3DVarAOWCDA", "C48mx500_hybAOWCDA", "C48_S2SWA_gefs", "C48_S2SW_extended", "C48_S2SW", "C96_atm3DVar_extended", "C96_atm3DVar", "C96C48_hybatmaerosnowDA", "C96C48_hybatmDA", "C96C48_ufs_hybatmDA", "C96mx100_S2S"]
  tags:
    - ${MACHINE}
  dependencies:
    - build

run_tests:
  variables:
    GIT_STRATEGY: none
  stage: run_tests
  script:
    - echo "Using build directory ${HOMEGFS} (dated ${BUILD_DATE})"
    - echo "stubbing run-check"
    #- ${HOMEGFS}/ci/scripts/run-check_ci.sh ${HOMEGFS} ${pslot} global-workflow-${BUILD_DATE}  --get_pslot_list
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  tags:
    - ${MACHINE}
  dependencies:
    - setup_generate_workflows
