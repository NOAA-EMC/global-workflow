stages:
  - build
  - create_experments
  - run_tests
  
variables:
  BUILD_DATE: 'friday'
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/global-workflow-${BUILD_DATE}'
  HOMEGFS: $GIT_CLONE_PATH
  RUNTESTS_DIR: $CI_BUILDS_DIR/RUNTESTS
  GIT_DEPTH: 1

build:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  
  stage: build
  script:
    - 'echo "Using build directory: ${HOMEGFS} (dated: ${BUILD_DATE})"'
    - export CI_PROJECT_DIR=$HOMEGFS
    - ci/scripts/utils/ci_utils_wrapper.sh build_compute
    - sorc/link_workflow.sh
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  tags:
    - ${MACHINE}

setup:
  variables:
    GIT_STRATEGY: none
  stage: create_experments
  script:
    - 'echo "Using build directory: $HOMEGFS (dated: ${BUILD_DATE})"'
    - export CI_PROJECT_DIR=$HOMEGFS
    - cd ${HOMEGFS}/workflow
    - HASH=$(git rev-parse HEAD)
    - mkdir -p ${RUNTESTS_DIR}
    - echo ${PWD}
    - ./generate_workflows.sh -G -t ${HASH} ${RUNTESTS_DIR}
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  tags:
    - ${MACHINE}
  dependencies:
    - build

run_tests:
  variables:
    GIT_STRATEGY: none
  stage: run_tests
  script:
    - 'echo "Using build directory: $HOMEGFS (dated: ${BUILD_DATE})"'
    - echo ${PWD}
    - export CI_PROJECT_DIR=$HOMEGFS
    - echo ${PWD}
    - echo "stubbing run-check"
    #- ${HOMEGFS}/ci/scripts/run-check_ci.sh ${HOMEGFS} ${pslot} global-workflow-${BUILD_DATE}  --get_pslot_list
  parallel:
    matrix:
      - MACHINE: ["gaeac6"]
  tags:
    - ${MACHINE}
  dependencies:
    - setup
