# CTest Case: C48_ATM-gfs_stage_ic
#
# Purpose: Validate the staging of atmospheric initial conditions (ICs)
# from a baseline COM directory to the experiment's ROTDIR. This test
# ensures that the JGFS_ATMOS_STAGE_IC job correctly handles file
# staging, directory creation, and timestamping.
#
# Source pedigree: inputs come from the nightly STAGED_CTESTS COMROOT snapshot
# for `PSLOT=C48_ATM` (e.g., 2021032312) and are compared to the same baseline.

{% set cyc = TEST_DATE | strftime('%H') %}
{% set PDY = TEST_DATE | to_YMD %}
{% set SRC_DIR = STAGED_CTESTS + '/COMROOT/' + PSLOT %}
{% set DST_DIR = RUNTESTS + '/COMROOT/' + TEST_NAME %}
{% set SRC_ANALYSIS_DIR = SRC_DIR + '/gfs.' + PDY + '/' + cyc + '/analysis/atmos' %}
{% set DST_ANALYSIS_DIR = DST_DIR + '/gfs.' + PDY + '/' + cyc + '/analysis/atmos' %}

input_files:
    # Stage the IC bundle produced by JGFS_ATMOS_STAGE_IC in the baseline COMROOT.
    mkdir:
        # Mirror the analysis/atmos branch under the test COMROOT destination.
        - {{ DST_ANALYSIS_DIR }}

    copy:
        # Files originate from {{ SRC_ANALYSIS_DIR }} inside the staged baseline snapshot.
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmanl.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmanl.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl.ges]

output_files:
    # Validate that the staged ICs match the authoritative baseline copies.
    cmpfiles:
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmanl.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmanl.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfcanl.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f000.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.sfc_f006.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf000.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.atmf006.nc.ges]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl]
        - [{{ SRC_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl.ges, {{ DST_ANALYSIS_DIR }}/gfs.t{{ cyc }}z.nstanl.ges]
