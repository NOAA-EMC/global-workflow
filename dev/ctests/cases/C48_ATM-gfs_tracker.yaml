{% set cyc = TEST_DATE | strftime('%H') %}
{% set PDY = TEST_DATE | to_YMD %}
{% set SRC_DIR = STAGED_CTESTS + '/COMROOT/' + PSLOT %}
{% set DST_DIR = RUNTESTS + '/COMROOT/' + TEST_NAME %}

# CTest Case: C48_ATM-gfs_tracker
#
# Purpose: Validate tropical cyclone tracking against the frozen
# COMROOT baseline by reusing the true forecast history directory
# (model/atmos/history) instead of bespoke staged paths.

name: C48_ATM-gfs_tracker
suite: C48_ATM
platform: [hera, hercules, orion]

job:
  name: gfs_tracker
  script: jobs/JGFS_ATMOS_CYCLONE_TRACKER
  config: config.tracker

input:
  source_cycle: {{ PDY }}{{ cyc }}
  source_dir: {{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/model/atmos/history
  files:
    # The tracker consumes the full forecast history set; list the
    # first few hours explicitly and rely on the staged directory for the rest.
    - gfs.t{{ cyc }}z.atmf000.nc
    - gfs.t{{ cyc }}z.atmf001.nc
    - gfs.t{{ cyc }}z.atmf002.nc
    - gfs.t{{ cyc }}z.atmf003.nc
    - gfs.t{{ cyc }}z.atmf004.nc
    - gfs.t{{ cyc }}z.atmf005.nc
    - gfs.t{{ cyc }}z.atmf006.nc
    - gfs.t{{ cyc }}z.atmf120.nc

output:
  target_dir: {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/atmos/cyclone/tracks
  files:
    - gfs.t{{ cyc }}z.adeck
    - gfs.t{{ cyc }}z.bdeck
    - gfs.t{{ cyc }}z.adeck.invest
    - gfs.t{{ cyc }}z.bdeck.invest

validation:
  - script: validate.py
    args:
      - "--file_exists"
      - "--file_non_empty"
      - "--content_regex"
      - "adeck:^AL, 9"
      - "bdeck:^AL, 9"
