{% set H_offset = '-6H' %}
{% set H_timedelta = H_offset | to_timedelta %}
{% set TEST_DATE_offset = TEST_DATE | add_to_datetime(H_timedelta) %}

{% set cyc = TEST_DATE | strftime('%H') %}
{% set cyc_offset = TEST_DATE_offset | strftime('%H') %}

{% set PDY = TEST_DATE | to_YMD %}
{% set PDY_offset = TEST_DATE_offset | to_YMD %}
{% set SRC_DIR = STAGED_CTESTS + '/COMROOT/' + PSLOT %}
{% set DST_DIR = RUNTESTS + '/COMROOT/' + TEST_NAME %}

# =============================================================================
# C48_S2SW Ocean Products Test Case
# =============================================================================
# This test validates the gfs_ocean_prod_f006 task from the S2SW workflow.
# Tests ocean products generation at forecast hour f006 using the coupled
# Sea-to-Sea-to-Wave (S2SW) system.
#
# Workflow Context:
# - Task: gfs_ocean_prod_f006 (from metatask gfs_ocean_prod)
# - Job: oceanice_products.sh with COMPONENT=ocean
# - FHR_LIST: 6 (single forecast hour)
#
# Source Logic: scripts/exglobal_oceanice_products.py
# - Uses pygfs.task.oceanice_products.OceanIceProducts class
# - Creates GRIB2 products on 0p25, 0p50, 1p00 grids
# - Generates native netCDF subsets
#
# Configuration: parm/post/oceanice_products_gfs.yaml
# - Ocean section (lines 23-50): GRIB2 + native netCDF
# - Uses 6-hour averaged ocean history files as input
# =============================================================================

input_files:
    mkdir:
        - {{ DST_DIR }}/gdas.{{ PDY }}/{{ cyc_offset }}/model/ocean/restart
        - {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/model/ocean/history
        - {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p25
        - {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p50
        - {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/1p00
        - {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/netcdf

    copy:
        # Ocean restart files needed for initialization
        - [{{ SRC_DIR }}/gdas.{{ PDY }}/06/model/ocean/restart/{{ PDY }}.{{ cyc }}0000.MOM.res.nc, {{ DST_DIR }}/gdas.{{ PDY }}/06/model/ocean/restart/{{ PDY }}.{{ cyc }}0000.MOM.res.nc]

        # Ocean history files from forecast (6-hour averaged output for f006)
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/model/ocean/history/gfs.ocean.t{{ cyc }}z.6hr_avg.f006.nc, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/model/ocean/history/gfs.ocean.t{{ cyc }}z.6hr_avg.f006.nc]

output_files:
    cmpfiles:
        # Ocean GRIB2 products at multiple resolutions for f006
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p25/gfs.ocean.t{{ cyc }}z.0p25.f006.grib2, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p25/gfs.ocean.t{{ cyc }}z.0p25.f006.grib2]
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p25/gfs.ocean.t{{ cyc }}z.0p25.f006.grib2.idx, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p25/gfs.ocean.t{{ cyc }}z.0p25.f006.grib2.idx]
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p50/gfs.ocean.t{{ cyc }}z.0p50.f006.grib2, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p50/gfs.ocean.t{{ cyc }}z.0p50.f006.grib2]
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p50/gfs.ocean.t{{ cyc }}z.0p50.f006.grib2.idx, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/0p50/gfs.ocean.t{{ cyc }}z.0p50.f006.grib2.idx]
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/1p00/gfs.ocean.t{{ cyc }}z.1p00.f006.grib2, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/1p00/gfs.ocean.t{{ cyc }}z.1p00.f006.grib2]
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/1p00/gfs.ocean.t{{ cyc }}z.1p00.f006.grib2.idx, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/grib2/1p00/gfs.ocean.t{{ cyc }}z.1p00.f006.grib2.idx]

        # Ocean native netCDF products
        - [{{ SRC_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/netcdf/gfs.ocean.t{{ cyc }}z.native.f006.nc, {{ DST_DIR }}/gfs.{{ PDY }}/{{ cyc }}/products/ocean/netcdf/gfs.ocean.t{{ cyc }}z.native.f006.nc]
