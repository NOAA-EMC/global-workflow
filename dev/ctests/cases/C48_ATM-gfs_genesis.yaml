# CTest Case: C48_ATM-gfs_genesis
#
# Purpose: Validate the execution of the tropical cyclone genesis detection
# algorithm. This test ensures that the JGFS_ATMOS_CYCLONE_GENESIS job
# runs successfully and produces the expected output files containing
# genesis probability information.
#
# Source pedigree: leverages the same gfs_fcst_seg0 forecast history staged
# under STAGED_CTESTS and verifies genesis_vital outputs against baseline COMROOT.

{% set cyc = TEST_DATE | strftime('%H') %}
{% set PDY = TEST_DATE | to_YMD %}
{% set SRC_DIR = STAGED_CTESTS + '/COMROOT/' + PSLOT %}
{% set DST_DIR = RUNTESTS + '/COMROOT/' + TEST_NAME %}
{% set SRC_HISTORY_DIR = SRC_DIR + '/gfs.' + PDY + '/' + cyc + '/model/atmos/history' %}
{% set DST_HISTORY_DIR = DST_DIR + '/gfs.' + PDY + '/' + cyc + '/model/atmos/history' %}
{% set SRC_GENESIS_DIR = SRC_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/cyclone/genesis_vital' %}
{% set DST_GENESIS_DIR = DST_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/cyclone/genesis_vital' %}

input_files:
    # Provide the history subset that drives the genesis detector pipeline.
    mkdir:
        - {{ DST_HISTORY_DIR }}
        - {{ DST_GENESIS_DIR }}

    copy:
        # Files originate from {{ SRC_HISTORY_DIR }} within the staged baseline COMROOT.
        - [{{ SRC_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf000.nc, {{ DST_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf000.nc]
        - [{{ SRC_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf006.nc, {{ DST_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf006.nc]
        - [{{ SRC_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf012.nc, {{ DST_HISTORY_DIR }}/gfs.t{{ cyc }}z.atmf012.nc]

output_files:
    # Compare genesis probability artifacts against the authoritative baseline.
    cmpfiles:
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.all.bs, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.all.bs]
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.east.bs, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.east.bs]
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.west.bs, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.west.bs]
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.all.grb2, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.all.grb2]
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.east.grb2, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.east.grb2]
        - [{{ SRC_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.west.grb2, {{ DST_GENESIS_DIR }}/gfs.t{{ cyc }}z.genesis.west.grb2]
