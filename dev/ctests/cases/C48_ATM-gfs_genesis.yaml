# CTest Case: C48_ATM-gfs_genesis
#
# Purpose: Validate the execution of the tropical cyclone genesis detection
# algorithm. This test ensures that the JGFS_ATMOS_CYCLONE_GENESIS job
# runs successfully and produces the expected output files containing
# genesis probability information.
#
# Source pedigree: consumes GRIB2 products from gfs_atmos_prod in
# `products/atmos/grib2/0p25` under STAGED_CTESTS and verifies genesis_vital
# outputs against baseline COMROOT.

{% set cyc = TEST_DATE | strftime('%H') %}
{% set PDY = TEST_DATE | to_YMD %}
{% set SRC_DIR = STAGED_CTESTS + '/COMROOT/' + PSLOT %}
{% set DST_DIR = RUNTESTS + '/COMROOT/' + TEST_NAME %}
{% set SRC_GRIB_DIR = SRC_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/grib2/0p25' %}
{% set DST_GRIB_DIR = DST_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/grib2/0p25' %}
{% set SRC_GENESIS_DIR = SRC_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/cyclone/genesis_vital' %}
{% set DST_GENESIS_DIR = DST_DIR + '/gfs.' + PDY + '/' + cyc + '/products/atmos/cyclone/genesis_vital' %}

input_files:
    # Provide the GRIB2 products that drive the genesis detector pipeline.
    mkdir:
        - {{ DST_GRIB_DIR }}
        - {{ DST_GENESIS_DIR }}

    copy:
        # Files originate from {{ SRC_GRIB_DIR }} within the staged baseline COMROOT.
        - [{{ SRC_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f000, {{ DST_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f000]
        - [{{ SRC_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f006, {{ DST_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f006]
        - [{{ SRC_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f012, {{ DST_GRIB_DIR }}/gfs.t{{ cyc }}z.pgrb2.0p25.f012]

output_files:
    # Genesis vitals outputs - compare vitals and atcf files
    cmpfiles:
        - [{{ SRC_GENESIS_DIR }}/all.vitals.gfs.gfso.2021, {{ DST_GENESIS_DIR }}/all.vitals.gfs.gfso.2021]
        - [{{ SRC_GENESIS_DIR }}/genesis.vitals.gfs.gfso.2021, {{ DST_GENESIS_DIR }}/genesis.vitals.gfs.gfso.2021]
        - [{{ SRC_GENESIS_DIR }}/storms.gfso.atcf_gen.altg.{{ TEST_DATE }}, {{ DST_GENESIS_DIR }}/storms.gfso.atcf_gen.altg.{{ TEST_DATE }}]
        - [{{ SRC_GENESIS_DIR }}/trak.gfso.atcfunix.altg.{{ TEST_DATE }}, {{ DST_GENESIS_DIR }}/trak.gfso.atcfunix.altg.{{ TEST_DATE }}]
