# THIS FILE IS THE CORE TEMPLATE FOR THE GITLAB CI/CD PIPELINES
# Lines below the following demarcation line will be included in the resulting pipeline.
# Do not edit the generated sections in the resulting .gitlab-ci.yml file when updating
# the system but here instead (in this file).
# ------------------------------------------------------------

# This file is used to define the GitLab CI/CD pipeline stages:
# building, setting up experiments, and running tests on different machines.
stages:
  - build
  - create_experiments
  - run_tests
  - finalize

variables:
  BUILD: ''
  CI_RUN_PATH: ${CI_BUILDS_DIR}/${BUILD}/${CI_COMMIT_SHORT_SHA}
  GIT_CLONE_PATH: '${CI_RUN_PATH}/global-workflow'
  HOMEGFS: ${GIT_CLONE_PATH}
  RUNTESTS_DIR: ${CI_RUN_PATH}/RUNTESTS
  GIT_DEPTH: 1
  RUNNER_SCRIPT_TIMEOUT: 6h
  RUNNER_AFTER_SCRIPT_TIMEOUT: 6h
  # GitHub API trigger detection - defaults to false
  GITHUB_API_TRIGGER: ${GITHUB_API_TRIGGER:-"false"}
  PR_NUMBER: ${PR_NUMBER:-"0"}

# Include the appropriate modality file based on the trigger
include:
  # Include ctests configuration when triggered via GitHub API
  - local: 'dev/ci/.gitlab-ci-ctests.yml'
    rules:
      - if: $GITHUB_API_TRIGGER == "true"
  # Include standard cases configuration when not triggered via GitHub API
  - local: 'dev/ci/.gitlab-ci-cases.yml'
    rules:
      - if: $GITHUB_API_TRIGGER != "true"

# Base configuration
.base_config:
  variables:
    GIT_STRATEGY: none

# Common build template for all modalities
.build_template:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  stage: build
  allow_failure: true
  script:
    - echo "Using build directory ${HOMEGFS}"
    - dev/ci/scripts/utils/ci_utils.sh build_compute
    - sorc/link_workflow.sh
    - mkdir -p ${RUNTESTS_DIR}

.setup_template:
  extends: .base_config
  stage: create_experiments
  allow_failure: true
  script:
    - export RUNTESTS=${RUNTESTS_DIR}
    - ${HOMEGFS}/dev/ci/scripts/utils/ci_utils.sh create_experiment ${HOMEGFS}/dev/ci/cases/pr/${caseName}.yaml
  dependencies:
    - build-${machine}

.run_tests_template:
  extends: .base_config
  stage: run_tests
  allow_failure: true
  script:
    - echo "Using build directory $HOMEGFS (dated $BUILD_DATE)"
    - pslot=$(${HOMEGFS}/dev/ci/scripts/utils/ci_utils.sh get_pslot ${RUNTESTS_DIR} ${caseName})
    - ${HOMEGFS}/dev/ci/scripts/run_check_ci.sh ${CI_RUN_PATH} ${pslot} global-workflow
  dependencies:
    - setup_experiments-${machine}
  
