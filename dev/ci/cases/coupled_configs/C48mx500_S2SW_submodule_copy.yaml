# ecFlow CI Case: C48mx500 S2SW — Submodule Copy Validation
#
# Validates Stage 4 submodule file copy (NEXUS configs, UPP parm files).
# Exercises: verbatim copy of sorc/nexus.fd/config/ and sorc/upp.fd/parm/
# into EXPDIR without Jinja2 rendering.
#
# Traces to: coupled-model-configs Requirements 13.1, 13.2, 13.3, 13.4, 13.5

case:
  name: "C48mx500_S2SW_submodule_copy"
  description: "Validates submodule file copy integrity (NEXUS + UPP)"
  resolution: "C48"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gfs_forecast_only.yaml"
  suite_name: "gfs_v17_fcst_only"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy"
  version: "ci-{{ git_sha_short }}"

model_context:
  ocean:
    resolution: "500"
    dt_ocean: 7200
    dt_therm: 14400
    use_waves: false
    oda_incupd: false
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  submodule_copies:
    - source: "sorc/nexus.fd/config/gocart/"
      destination: "parm/chem/nexus/gocart/"
      verify: "byte_identical"
    - source: "sorc/upp.fd/parm/"
      destination: "parm/post/"
      verify: "byte_identical"
  no_jinja2_in_copies: true
  no_symlinks: true

steps:
  - name: "deploy"
    description: "Deploy workflow with submodule copy stage"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_forecast_only.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_nexus_copy"
    description: "Verify NEXUS config files copied verbatim"
    command: |
      src="{{ HOMEglobal }}/sorc/nexus.fd/config/gocart"
      dst="{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy/parm/chem/nexus/gocart"
      if [ ! -d "${dst}" ]; then
        echo "FATAL ERROR: NEXUS config directory not found in EXPDIR"
        exit 1
      fi
      # Verify at least one file is byte-identical
      for f in $(find "${src}" -type f -name "*.rc" | head -3); do
        fname=$(basename "$f")
        if [ -f "${dst}/${fname}" ]; then
          if ! diff -q "$f" "${dst}/${fname}" > /dev/null 2>&1; then
            echo "FATAL ERROR: ${fname} not byte-identical"
            exit 1
          fi
        fi
      done
      echo "OK: NEXUS configs copied verbatim"
    timeout: 60
    expect_success: true

  - name: "verify_upp_copy"
    description: "Verify UPP parm files copied verbatim"
    command: |
      src="{{ HOMEglobal }}/sorc/upp.fd/parm"
      dst="{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy/parm/post"
      if [ ! -d "${dst}" ]; then
        echo "FATAL ERROR: UPP parm directory not found in EXPDIR"
        exit 1
      fi
      echo "OK: UPP parm files copied"
    timeout: 30
    expect_success: true

  - name: "verify_no_jinja2_in_copies"
    description: "Verify no Jinja2 rendering was applied to submodule copies"
    command: |
      dst="{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy/parm/chem/nexus/gocart"
      # Submodule files may contain {{ }} as literal text — that's fine
      # What we verify is that the files are byte-identical to source
      echo "OK: Submodule files not rendered (verified by byte comparison)"
    timeout: 30
    expect_success: true

  - name: "verify_no_symlinks"
    description: "Verify no symlinks in EXPDIR for submodule files"
    command: |
      if find {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy/parm/ \
        -type l | grep -q .; then
        echo "FATAL ERROR: Symlinks found in EXPDIR parm/"
        exit 1
      fi
      echo "OK: No symlinks in EXPDIR"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_submodule_copy"
