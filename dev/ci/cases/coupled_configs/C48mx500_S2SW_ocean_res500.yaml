# ecFlow CI Case: C48mx500 S2SW — Ocean Resolution 500 (Coarse)
#
# Validates coupled-model config rendering for the coarsest ocean resolution.
# Exercises: MOM_input.j2 (500 branch), ice_in.j2, ww3_shel.nml.j2, MOM6_data_table.j2
# Cold start, CPL wave forcing, GFS post system.
#
# Traces to: coupled-model-configs Requirements 1.2, 1.5, 3.1, 4.2, 7.1, 12.1

case:
  name: "C48mx500_S2SW_ocean_res500"
  description: "Coupled S2SW with 5-degree ocean — validates coarse resolution config rendering"
  resolution: "C48"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gfs_forecast_only.yaml"
  suite_name: "gfs_v17_fcst_only"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500"
  version: "ci-{{ git_sha_short }}"

model_context:
  ocean:
    resolution: "500"
    dt_ocean: 7200
    dt_therm: 14400
    use_waves: true
    oda_incupd: false
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "NIGLOBAL = 72"
        - "NJGLOBAL = 35"
        - "DT = 7200"
        - "KHTH = 1000.0"
        - "USE_VARIABLE_MIXING = False"
    - path: "parm/ufs/ocean/MOM6_data_table"
      expect_contains:
        - "runoff"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
      expect_contains:
        - "runtype        = 'initial'"
        - "use_restart_time = .false."
        - "nx_global         = 72"
        - "ny_global         = 35"
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true
  shell_vars_preserved:
    - "${TOPOEDITS}"
    - "${CHLCLIM}"
    - "${SYEAR}"
    - "${SMONTH}"
    - "${SDAY}"
    - "${FHMAX}"

steps:
  - name: "deploy"
    description: "Deploy workflow with coupled-model config rendering (ocean res 500)"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_forecast_only.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500 \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_ocean_config"
    description: "Verify MOM_input rendered with correct 500-resolution parameters"
    command: |
      grep -q "NIGLOBAL = 72" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ocean/MOM_input
      grep -q "NJGLOBAL = 35" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ocean/MOM_input
      grep -q "DT = 7200" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ocean/MOM_input
      echo "OK: Ocean config verified for resolution 500"
    timeout: 30
    expect_success: true

  - name: "verify_ice_cold_start"
    description: "Verify ice_in rendered with cold start parameters"
    command: |
      grep -q "runtype        = 'initial'" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ice/ice_in
      grep -q "use_restart_time = .false." \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ice/ice_in
      echo "OK: Ice cold start config verified"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    description: "Verify no @[VAR] atparse tokens remain in rendered configs"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/; then
        echo "FATAL ERROR: Legacy @[VAR] tokens found in rendered configs"
        exit 1
      fi
      echo "OK: No legacy atparse tokens found"
    timeout: 30
    expect_success: true

  - name: "verify_no_symlinks"
    description: "Verify no symlinks to sorc/ in coupled-model config directory"
    command: |
      if find {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500/parm/ufs/ -type l | grep -q .; then
        echo "FATAL ERROR: Symlinks found in EXPDIR parm/ufs/"
        exit 1
      fi
      echo "OK: No symlinks in EXPDIR"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_ocean_res500"
