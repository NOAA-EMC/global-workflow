# ecFlow CI Case: GFS v17 Lowres Extended — Cycled S2SW Smoke
#
# Lower-resolution variant of GFS v17 cycled with 5-degree ocean and small
# ensemble for fast CI iteration. "Extended" indicates 6h interval cycling.
#
# Replaces legacy: dev/ci/cases/gfsv17/gfs.v17_lowres_extended.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.5, 12.1

case:
  name: "gfs_v17_lowres_extended"
  description: "GFS v17 lowres cycled S2SW — 5-degree ocean, 2 ensemble members"
  resolution: "C96"
  app: "S2SW"
  mode: "cycled"

workflow_config:
  path: "dev/parm/workflow/gfs_cycled.yaml"
  suite_name: "gfs_v17"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/gfs_v17_lowres_extended"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gfs"
  resdetatmos: 96
  resensatmos: 48
  resdetocean: 5.0
  nens: 2
  interval: 6
  start: "cold"
  idate: "2021122012"
  edate: "2021122200"
  icsdir: "{{ ICSDIR_ROOT }}/C96C48/20250808"

base:
  DOIAU: "YES"
  DO_JEDIOCNVAR: "YES"
  DOHYBVAR: "YES"
  DOHYBVAR_OCN: "YES"
  EUPD_CYC: "both"
  INTERVAL_GFS: 6

model_context:
  ocean:
    resolution: "500"
    dt_ocean: 7200
    dt_therm: 14400
    use_waves: true
    oda_incupd: true
    oda_incupd_nhours: 6
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

skip_ci_on_hosts:
  - awsepicglobalworkflow

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains: ["NIGLOBAL = 72"]
  no_legacy_tokens: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_cycled.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/gfs_v17_lowres_extended \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/gfs_v17_lowres_extended"
