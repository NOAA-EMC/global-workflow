# ecFlow CI Case: C1152mx025 S2SW — RDHPCS Variant
#
# RDHPCS-specific variant of C1152mx025_S2SW: single-cycle (interval=0)
# for rapid iteration on RDHPCS hosts (Gaea, Ursa).
#
# Replaces legacy: dev/ci/cases/gfsv17/C1152mx025_S2SW_rdhpcs.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.2, 12.1; immutable-dag 12.1

case:
  name: "C1152mx025_S2SW_rdhpcs"
  description: "C1152mx025 S2SW single-cycle for RDHPCS validation"
  resolution: "C1152"
  app: "S2SW"
  mode: "cycled"

workflow_config:
  path: "dev/parm/workflow/gfs_cycled.yaml"
  suite_name: "gfs_v17"

platform: "GAEAC6"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW_rdhpcs"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gfs"
  resdetatmos: 1152
  resensatmos: 384
  resdetocean: 0.25
  nens: 80
  interval: 0
  start: "warm"
  idate: "2024111506"
  edate: "2024111600"
  icsdir: "/gpfs/f6/drsa-precip3/world-shared/role.glopara/data/ICSDIR/retro_ICs"

base:
  DOIAU: "YES"
  DO_JEDIOCNVAR: "YES"
  DOHYBVAR_OCN: "YES"
  EUPD_CYC: "gdas"
  INTERVAL_GFS: 6
  FHMAX_GFS: 384
  FHMAX_HF_GFS: 120

model_context:
  ocean:
    resolution: "025"
    dt_ocean: 900
    dt_therm: 3600
    use_waves: true
    oda_incupd: true
    oda_incupd_nhours: 6
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 220
  ice:
    nprocs: 80
    decomposition: "slenderX2"
    dt_ice: 900
    grid: "grid_cice_NEMS_mx025.nc"
    mask: "kmtu_cice_NEMS_mx025.nc"
    nx_glb: 1440
    ny_glb: 1080
    warm_start: true
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains: ["NIGLOBAL = 1440"]
  no_legacy_tokens: true
  platform_isolation: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_cycled.yaml \
        --platform GAEAC6 \
        --expdir {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW_rdhpcs \
        --version ci-{{ git_sha_short }}
    timeout: 300
    expect_success: true

  - name: "verify_platform_isolation"
    description: "Verify platform-specific files are isolated to env/, modulefiles/"
    command: |
      test -f {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW_rdhpcs/env/GAEAC6.env
      echo "OK: GAEAC6 platform env present"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW_rdhpcs"
