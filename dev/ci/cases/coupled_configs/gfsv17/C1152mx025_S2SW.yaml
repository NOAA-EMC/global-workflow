# ecFlow CI Case: C1152mx025 S2SW — GFS v17 Production Configuration
#
# Validates the production GFS v17 cycled S2SW configuration with quarter-degree
# ocean and 80 ensemble members. Exercises the full coupled-model config rendering
# at production resolution with hybrid DA, ocean DA (SOCA), snow DA, and full
# 384-hour forecast.
#
# Replaces legacy: dev/ci/cases/gfsv17/C1152mx025_S2SW.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.2, 3.3, 4.2, 12.1; immutable-dag 2.1

case:
  name: "C1152mx025_S2SW"
  description: "Production GFS v17: C1152 atm, mx025 ocean, 80 ensemble members, 384h fcst"
  resolution: "C1152"
  app: "S2SW"
  mode: "cycled"

workflow_config:
  path: "dev/parm/workflow/gfs_cycled.yaml"
  suite_name: "gfs_v17"

platform: "WCOSS2"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gfs"
  resdetatmos: 1152
  resensatmos: 384
  resdetocean: 0.25
  nens: 80
  interval: 6
  start: "warm"
  idate: "2024111506"
  edate: "2025011600"
  icsdir: "/lfs/h2/emc/ptmp/emc.global/RETRO_GFSv17/IC/v2"

base:
  DOIAU: "YES"
  DO_JEDIOCNVAR: "YES"
  DO_JEDISNOWDA: "YES"
  DO_GSISOILDA: "YES"
  DO_LAND_IAU: ".true."
  DOHYBVAR: "YES"
  DOHYBVAR_OCN: "YES"
  EUPD_CYC: "gdas"
  INTERVAL_GFS: 6
  SDATE_GFS: "2024111512"
  FHMAX_GFS: 384
  FHMAX_HF_GFS: 120
  CASE_HIST: "C768"

model_context:
  ocean:
    resolution: "025"
    dt_ocean: 900
    dt_therm: 3600
    use_waves: true
    oda_incupd: true
    oda_incupd_nhours: 6
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 220
  ice:
    nprocs: 80
    decomposition: "slenderX2"
    dt_ice: 900
    grid: "grid_cice_NEMS_mx025.nc"
    mask: "kmtu_cice_NEMS_mx025.nc"
    nx_glb: 1440
    ny_glb: 1080
    warm_start: true
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

skip_ci_on_hosts:
  - awsepicglobalworkflow
  - container

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "NIGLOBAL = 1440"
        - "NJGLOBAL = 1080"
        - "USE_WAVES = True"
        - "ODA_INCUPD = True"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
      expect_contains:
        - "runtype        = 'continue'"
        - "use_restart_time = .true."
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true
  has_inter_cycle_dependencies: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_cycled.yaml \
        --platform WCOSS2 \
        --expdir {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW \
        --version ci-{{ git_sha_short }}
    timeout: 300
    expect_success: true

  - name: "verify_production_config"
    command: |
      grep -q "NIGLOBAL = 1440" \
        {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW/parm/ufs/ocean/MOM_input
      grep -q "USE_WAVES = True" \
        {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW/parm/ufs/ocean/MOM_input
      echo "OK: Production C1152mx025 config verified"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW/parm/ufs/; then
        echo "FATAL ERROR: Legacy tokens found"
        exit 1
      fi
      echo "OK: No legacy tokens"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C1152mx025_S2SW"
