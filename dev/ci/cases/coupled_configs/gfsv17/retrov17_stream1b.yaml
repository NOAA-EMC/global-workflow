# ecFlow CI Case: GFS v17 Retro Stream 1b — Feb-May 2024
#
# Retro stream 1b: 2024-02-15 → 2024-05-31 with 12h INTERVAL_GFS.
# Tests longer interval cycling.
#
# Replaces legacy: dev/ci/cases/gfsv17/retrov17_stream1b.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.2, 3.3

case:
  name: "retrov17_stream1b"
  description: "GFS v17 retro stream 1b — Feb-May 2024 (12h GFS interval)"
  resolution: "C1152"
  app: "S2SW"
  mode: "cycled"

workflow_config:
  path: "dev/parm/workflow/gfs_cycled.yaml"
  suite_name: "gfs_v17"

platform: "GAEAC6"

deployment:
  expdir: "/gpfs/f6/gfs-cpu/world-shared/role.glopara/RETRO_GFSv17/expdir/stream1b"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gfs"
  resdetatmos: 1152
  resensatmos: 384
  resdetocean: 0.25
  nens: 80
  interval: 6
  start: "warm"
  idate: "2024021506"
  edate: "2024053118"
  icsdir: "/gpfs/f6/gfs-cpu/world-shared/role.glopara/RETRO_GFSv17/IC/v3"

base:
  DOIAU: "YES"
  DO_JEDIOCNVAR: "YES"
  DOHYBVAR: "YES"
  DOHYBVAR_OCN: "YES"
  EUPD_CYC: "gdas"
  INTERVAL_GFS: 12
  SDATE_GFS: "2024030100"
  FHMAX_GFS: 384
  CASE_HIST: "C768"

model_context:
  ocean: { resolution: "025", dt_ocean: 900, dt_therm: 3600, use_waves: true,
           oda_incupd: true, oda_incupd_nhours: 6, do_sppt: false, river_runoff: true,
           diag_coord_def_z_file: "oceanda_zgrid_75L.nc",
           frunoff: "INPUT/runoff.daitren.clim.nc", tasks: 220 }
  ice: { nprocs: 80, decomposition: "slenderX2", dt_ice: 900,
         grid: "grid_cice_NEMS_mx025.nc", mask: "kmtu_cice_NEMS_mx025.nc",
         nx_glb: 1440, ny_glb: 1080, warm_start: true, histfreq_n: 1,
         hist_avg: true, dumpfreq: "d", dumpfreq_n: 1, ktherm: 2, tr_pond_lvl: true }
  wave: { ice_input: "CPL", current_input: "CPL", output_params: "HS FP DP",
          dt_field_output: 10800, dt_point_output: 3600, grid_output_dir: "./",
          point_output_dir: "./", restart_output_dir: "./RESTART/" }
  post: { system: "gfs" }

validation:
  no_legacy_tokens: true
  has_inter_cycle_dependencies: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow --config {{ HOMEglobal }}/dev/parm/workflow/gfs_cycled.yaml \
        --platform GAEAC6 \
        --expdir /gpfs/f6/gfs-cpu/world-shared/role.glopara/RETRO_GFSv17/expdir/stream1b \
        --version ci-{{ git_sha_short }}
    timeout: 300
    expect_success: true

cleanup:
  - "rm -rf /gpfs/f6/gfs-cpu/world-shared/role.glopara/RETRO_GFSv17/expdir/stream1b"
