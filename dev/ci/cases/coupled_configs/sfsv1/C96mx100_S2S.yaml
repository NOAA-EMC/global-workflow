# ecFlow CI Case: C96mx100 S2S — SFS 1-Degree Ensemble (Full)
#
# Validates SFS at C96 atmosphere with 1-degree ocean and 10 ensemble members.
# Full SFS variant with seasonal forecasts.
#
# Replaces legacy: dev/ci/cases/sfsv1/C96mx100_S2S.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.3, 6.4 (sfs post)

case:
  name: "C96mx100_S2S"
  description: "SFS C96 atm with mx100 ocean — 10-member full seasonal ensemble"
  resolution: "C96"
  app: "S2S"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/sfs.yaml"
  suite_name: "sfs_v1"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C96mx100_S2S"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "sfs"
  resdetatmos: 96
  resensatmos: 96
  resdetocean: 1
  nens: 10
  start: "cold"
  idate: "1994050100"
  edate: "1994050100"
  icsdir: "{{ BASE_IC }}/C96mx100/20240610"

base:
  FHMAX_GFS: 144
  USE_OCN_ENS_PERTURB_FILES: "YES"
  USE_ATM_ENS_PERTURB_FILES: "YES"
  MOM6_INTERP_ICS: "YES"

model_context:
  ocean:
    resolution: "100"
    dt_ocean: 3600
    dt_therm: 7200
    use_waves: false
    oda_incupd: false
    do_sppt: true
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 60
  ice:
    nprocs: 36
    decomposition: "slenderX2"
    dt_ice: 3600
    grid: "grid_cice_NEMS_mx100.nc"
    mask: "kmtu_cice_NEMS_mx100.nc"
    nx_glb: 360
    ny_glb: 320
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "YES"
    current_input: "YES"
    output_params: "HS FP DP"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "sfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "NIGLOBAL = 360"
        - "NJGLOBAL = 320"
        - "DO_SPPT = True"
    - path: "parm/ufs/post/post_itag"
      expect_contains: ["sfs"]
  no_legacy_tokens: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/sfs.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C96mx100_S2S \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_sfs_ensemble"
    description: "Verify SFS post_itag and 1-deg ocean config"
    command: |
      grep -q "sfs" {{ RUNTESTS }}/EXPDIR/C96mx100_S2S/parm/ufs/post/post_itag
      grep -q "NIGLOBAL = 360" {{ RUNTESTS }}/EXPDIR/C96mx100_S2S/parm/ufs/ocean/MOM_input
      echo "OK: SFS C96mx100 ensemble config verified"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C96mx100_S2S"
