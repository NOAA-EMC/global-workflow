# ecFlow CI Case: C96mx050 S2SW — Ocean Resolution 050 (Half-degree)
#
# Validates coupled-model config rendering for half-degree ocean resolution.
# Exercises: MOM_input.j2 (050 branch), ice_in.j2 (cold start), ww3_shel.nml.j2 (YES forcing),
# MOM6_data_table.j2 (no river runoff).
#
# Traces to: coupled-model-configs Requirements 1.3, 3.1, 4.3, 4.4, 12.1

case:
  name: "C96mx050_S2SW_ocean_res050"
  description: "Coupled S2SW with half-degree ocean — validates YES wave forcing and no river runoff"
  resolution: "C96"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gfs_forecast_only.yaml"
  suite_name: "gfs_v17_fcst_only"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050"
  version: "ci-{{ git_sha_short }}"

model_context:
  ocean:
    resolution: "050"
    dt_ocean: 1800
    dt_therm: 3600
    use_waves: true
    oda_incupd: false
    do_sppt: false
    river_runoff: false
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 80
  ice:
    nprocs: 36
    decomposition: "slenderX2"
    dt_ice: 1800
    grid: "grid_cice_NEMS_mx050.nc"
    mask: "kmtu_cice_NEMS_mx050.nc"
    nx_glb: 720
    ny_glb: 576
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "YES"
    current_input: "YES"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "NIGLOBAL = 720"
        - "NJGLOBAL = 576"
        - "DT = 1800"
        - "DT_THERM = 3600"
        - "KHTH = 50.0"
        - "KHTR = 50.0"
        - "SMAG_BI_CONST = 0.06"
        - "USE_VARIABLE_MIXING = True"
        - "USE_WAVES = True"
        - "ODA_INCUPD = False"
        - "DO_SPPT = False"
      expect_not_contains:
        - "RIVER_RUNOFF = True"
    - path: "parm/ufs/ocean/MOM6_data_table"
      expect_not_contains:
        - "runoff"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
      expect_contains:
        - "runtype        = 'initial'"
        - "use_restart_time = .false."
        - "nx_global         = 720"
        - "ny_global         = 576"
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true

steps:
  - name: "deploy"
    description: "Deploy workflow with coupled-model config rendering (ocean res 050)"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_forecast_only.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050 \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_ocean_config"
    description: "Verify MOM_input rendered with correct 050-resolution parameters"
    command: |
      grep -q "NIGLOBAL = 720" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/ocean/MOM_input
      grep -q "NJGLOBAL = 576" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/ocean/MOM_input
      grep -q "KHTH = 50.0" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/ocean/MOM_input
      echo "OK: Ocean config verified for resolution 050"
    timeout: 30
    expect_success: true

  - name: "verify_no_river_runoff"
    description: "Verify river runoff not present when river_runoff=false"
    command: |
      if grep -q "RIVER_RUNOFF = True" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/ocean/MOM_input; then
        echo "FATAL ERROR: RIVER_RUNOFF should not be set when river_runoff=false"
        exit 1
      fi
      if grep -q "runoff" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/ocean/MOM6_data_table; then
        echo "FATAL ERROR: runoff entry should not be in data_table when river_runoff=false"
        exit 1
      fi
      echo "OK: River runoff correctly absent"
    timeout: 30
    expect_success: true

  - name: "verify_wave_yes_forcing"
    description: "Verify WW3 forcing mode mapped correctly for YES inputs (T flag)"
    command: |
      # YES → 'T' flag in rendered ww3_shel.nml
      grep -q "'T'" \
        {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/wave/ww3_shel.nml
      echo "OK: Wave YES forcing mode verified (T flag)"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    description: "Verify no @[VAR] atparse tokens remain in rendered configs"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050/parm/ufs/; then
        echo "FATAL ERROR: Legacy @[VAR] tokens found in rendered configs"
        exit 1
      fi
      echo "OK: No legacy atparse tokens found"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C96mx050_S2SW_ocean_res050"
