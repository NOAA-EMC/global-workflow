# ecFlow CI Case: C48mx500 S2SW — Ocean Resolution Defaults Override
#
# Validates that explicit model.ocean values override resolution defaults,
# while default-only keys are correctly populated from the defaults table.
# Exercises: merge_ocean_resolution_defaults() logic.
#
# Traces to: coupled-model-configs Requirements 12.1, 12.2, 12.3, 12.4

case:
  name: "C48mx500_S2SW_resolution_defaults"
  description: "Validates ocean resolution defaults merge — explicit overrides"
  resolution: "C48"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gfs_forecast_only.yaml"
  suite_name: "gfs_v17_fcst_only"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults"
  version: "ci-{{ git_sha_short }}"

# Explicit dt_ocean=9999 should override the 500-resolution default of 7200
model_context:
  ocean:
    resolution: "500"
    dt_ocean: 9999
    dt_therm: 14400
    use_waves: false
    oda_incupd: false
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        # Explicit override: dt_ocean=9999 instead of default 7200
        - "DT = 9999"
        # From defaults (not explicitly set): NIGLOBAL, NJGLOBAL, KHTH
        - "NIGLOBAL = 72"
        - "NJGLOBAL = 35"
        - "KHTH = 1000.0"
      expect_not_contains:
        # Should NOT have the default dt_ocean value
        - "DT = 7200"
  no_legacy_tokens: true

steps:
  - name: "deploy"
    description: "Deploy with explicit dt_ocean override of resolution default"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_forecast_only.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_explicit_override"
    description: "Verify explicit dt_ocean=9999 overrides default 7200"
    command: |
      grep -q "DT = 9999" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults/parm/ufs/ocean/MOM_input
      if grep -q "DT = 7200" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults/parm/ufs/ocean/MOM_input; then
        echo "FATAL ERROR: Default dt_ocean=7200 should be overridden"
        exit 1
      fi
      echo "OK: Explicit dt_ocean override verified"
    timeout: 30
    expect_success: true

  - name: "verify_defaults_populated"
    description: "Verify resolution defaults populated for non-explicit keys"
    command: |
      # NIGLOBAL and NJGLOBAL come from defaults[500] since not explicit
      grep -q "NIGLOBAL = 72" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults/parm/ufs/ocean/MOM_input
      grep -q "NJGLOBAL = 35" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults/parm/ufs/ocean/MOM_input
      grep -q "KHTH = 1000.0" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults/parm/ufs/ocean/MOM_input
      echo "OK: Resolution defaults correctly populated"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_resolution_defaults"
