# ecFlow CI Case: C768 S2SW Forecast-Only — Hires Smoke Test
#
# High-resolution C768 forecast-only S2SW with quarter-degree ocean.
# Tests Jinja2 template rendering at high resolution without DA.
#
# Replaces legacy: dev/ci/cases/hires/C768_S2SW.yaml (Rocoto)
# Traces to: coupled-model-configs Requirements 1.2, 4.2, 12.1

case:
  name: "C768_S2SW"
  description: "Hires C768 forecast-only S2SW with mx025 ocean"
  resolution: "C768"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gfs_forecast_only.yaml"
  suite_name: "gfs_v17_fcst_only"

platform: "WCOSS2"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C768_S2SW"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gfs"
  resdetatmos: 768
  resdetocean: 0.25
  idate: "2019120300"
  edate: "2019120300"

base:
  DO_TEST_MODE: "YES"
  DO_METP: "NO"

model_context:
  ocean:
    resolution: "025"
    dt_ocean: 900
    dt_therm: 3600
    use_waves: true
    oda_incupd: false
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 180
  ice:
    nprocs: 60
    decomposition: "slenderX2"
    dt_ice: 900
    grid: "grid_cice_NEMS_mx025.nc"
    mask: "kmtu_cice_NEMS_mx025.nc"
    nx_glb: 1440
    ny_glb: 1080
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gfs"

validation:
  rendered_configs:
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "NIGLOBAL = 1440"
        - "NJGLOBAL = 1080"
        - "USE_WAVES = True"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
      expect_contains:
        - "runtype        = 'initial'"
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gfs_forecast_only.yaml \
        --platform WCOSS2 \
        --expdir {{ RUNTESTS }}/EXPDIR/C768_S2SW \
        --version ci-{{ git_sha_short }}
    timeout: 240
    expect_success: true

  - name: "verify_hires_ocean"
    command: |
      grep -q "NIGLOBAL = 1440" \
        {{ RUNTESTS }}/EXPDIR/C768_S2SW/parm/ufs/ocean/MOM_input
      echo "OK: Hires C768 mx025 config verified"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C768_S2SW"
