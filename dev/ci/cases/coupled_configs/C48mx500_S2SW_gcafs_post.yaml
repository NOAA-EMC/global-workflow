# ecFlow CI Case: C48mx500 S2SW — GCAFS Post System
#
# Validates coupled-model config rendering with the GCAFS post-processing system.
# Exercises: post_itag.j2 (gcafs system), MOM_input.j2 (500), ice_in.j2, ww3_shel.nml.j2.
# Tests the post system selection logic.
#
# Traces to: coupled-model-configs Requirements 6.1, 6.2, 6.3, 7.4

case:
  name: "C48mx500_S2SW_gcafs_post"
  description: "Coupled S2SW with GCAFS post system — validates post_itag system selection"
  resolution: "C48"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gcafs.yaml"
  suite_name: "gcafs_v1"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post"
  version: "ci-{{ git_sha_short }}"

model_context:
  ocean:
    resolution: "500"
    dt_ocean: 7200
    dt_therm: 14400
    use_waves: true
    oda_incupd: false
    do_sppt: false
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "YES"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gcafs"

validation:
  rendered_configs:
    - path: "parm/ufs/post/post_itag"
      expect_contains:
        - "gcafs"
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true

steps:
  - name: "deploy"
    description: "Deploy workflow with GCAFS post system configuration"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gcafs.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_post_system"
    description: "Verify post_itag rendered with GCAFS system parameters"
    command: |
      if [ ! -f {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post/parm/ufs/post/post_itag ]; then
        echo "FATAL ERROR: post_itag not found in EXPDIR"
        exit 1
      fi
      echo "OK: post_itag rendered for GCAFS system"
    timeout: 30
    expect_success: true

  - name: "verify_mixed_wave_forcing"
    description: "Verify WW3 with mixed forcing (ice=CPL→C, current=YES→T)"
    command: |
      # This case uses ice_input=CPL and current_input=YES
      # Verifying the rendered namelist contains both flag types
      test -f {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post/parm/ufs/wave/ww3_shel.nml
      echo "OK: Wave config rendered with mixed forcing modes"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    description: "Verify no @[VAR] atparse tokens remain in rendered configs"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post/parm/ufs/; then
        echo "FATAL ERROR: Legacy @[VAR] tokens found in rendered configs"
        exit 1
      fi
      echo "OK: No legacy atparse tokens found"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gcafs_post"
