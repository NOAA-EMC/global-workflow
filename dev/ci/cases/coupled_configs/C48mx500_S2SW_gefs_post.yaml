# ecFlow CI Case: C48mx500 S2SW — GEFS Post System
#
# Validates coupled-model config rendering with the GEFS post-processing system.
# Exercises: post_itag.j2 (gefs system), coupled templates with ensemble context.
#
# Traces to: coupled-model-configs Requirements 6.1, 6.3, 7.4

case:
  name: "C48mx500_S2SW_gefs_post"
  description: "Coupled S2SW with GEFS post system — validates ensemble post configuration"
  resolution: "C48"
  app: "S2SW"
  mode: "forecast-only"

workflow_config:
  path: "dev/parm/workflow/gefs.yaml"
  suite_name: "gefs_v13"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post"
  version: "ci-{{ git_sha_short }}"

model_context:
  ocean:
    resolution: "500"
    dt_ocean: 7200
    dt_therm: 14400
    use_waves: true
    oda_incupd: false
    do_sppt: true
    river_runoff: true
    diag_coord_def_z_file: "oceanda_zgrid_75L.nc"
    frunoff: "INPUT/runoff.daitren.clim.nc"
    tasks: 12
  ice:
    nprocs: 12
    decomposition: "slenderX2"
    dt_ice: 7200
    grid: "grid_cice_NEMS_mx500.nc"
    mask: "kmtu_cice_NEMS_mx500.nc"
    nx_glb: 72
    ny_glb: 35
    warm_start: false
    histfreq_n: 1
    hist_avg: true
    dumpfreq: "d"
    dumpfreq_n: 1
    ktherm: 2
    tr_pond_lvl: true
  wave:
    ice_input: "CPL"
    current_input: "CPL"
    output_params: "HS FP DP PHS PTP PDIR CHA"
    dt_field_output: 10800
    dt_point_output: 3600
    grid_output_dir: "./"
    point_output_dir: "./"
    restart_output_dir: "./RESTART/"
  post:
    system: "gefs"

validation:
  rendered_configs:
    - path: "parm/ufs/post/post_itag"
      expect_contains:
        - "gefs"
    - path: "parm/ufs/ocean/MOM_input"
      validator: "MOM6ParameterValidator"
      expect_contains:
        - "DO_SPPT = True"
    - path: "parm/ufs/ice/ice_in"
      validator: "NamelistValidator"
    - path: "parm/ufs/wave/ww3_shel.nml"
      validator: "NamelistValidator"
  no_legacy_tokens: true
  no_symlinks: true

steps:
  - name: "deploy"
    description: "Deploy workflow with GEFS post system configuration"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gefs.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_post_system"
    description: "Verify post_itag rendered with GEFS system parameters"
    command: |
      if [ ! -f {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post/parm/ufs/post/post_itag ]; then
        echo "FATAL ERROR: post_itag not found in EXPDIR"
        exit 1
      fi
      echo "OK: post_itag rendered for GEFS system"
    timeout: 30
    expect_success: true

  - name: "verify_sppt_enabled"
    description: "Verify SPPT stochastics enabled for ensemble"
    command: |
      grep -q "DO_SPPT = True" \
        {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post/parm/ufs/ocean/MOM_input
      echo "OK: SPPT enabled for ensemble configuration"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    description: "Verify no @[VAR] atparse tokens remain in rendered configs"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post/parm/ufs/; then
        echo "FATAL ERROR: Legacy @[VAR] tokens found in rendered configs"
        exit 1
      fi
      echo "OK: No legacy atparse tokens found"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C48mx500_S2SW_gefs_post"
