# ecFlow CI Case: C96 GCAFS Cycled — Aerosol DA + Coupled Configs
#
# Validates GCAFS cycled DA workflow with coupled-model config rendering.
# Exercises: post_itag.j2 (gcafs system), GOCART NEXUS submodule copy,
# AERO_HISTORY.rc.j2, ATMA app variant.
#
# Replaces legacy: dev/ci/cases/gcafsv1/C96_gcafs_cycled.yaml (Rocoto)
# Traces to: coupled-model-configs Requirement 6.2, 13.1; templated-model-configs GOCART

case:
  name: "C96_gcafs_cycled"
  description: "GCAFS cycled DA with coupled-model config rendering"
  resolution: "C96"
  app: "ATMA"
  mode: "cycled"

workflow_config:
  path: "dev/parm/workflow/gcafs.yaml"
  suite_name: "gcafs_v1"

platform: "CONTAINER"

deployment:
  expdir: "{{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled"
  version: "ci-{{ git_sha_short }}"

experiment:
  net: "gcafs"
  resdetatmos: 96
  idate: "2021122012"
  edate: "2021122100"
  nens: 0
  interval: 12
  start: "cold"
  icsdir: "{{ BASE_IC }}/C96C48/20250808"

base:
  DO_TEST_MODE: "NO"
  AERO_ANL_RUNS: "gcdas"
  USE_IODADIR: "YES"

model_context:
  ocean: null
  ice: null
  wave: null
  post:
    system: "gcafs"

validation:
  rendered_configs:
    - path: "parm/ufs/post/post_itag"
      expect_contains:
        - "gcafs"
  submodule_copies:
    - source: "sorc/nexus.fd/config/gocart/"
      destination: "parm/chem/nexus/gocart/"
      verify: "byte_identical"
  no_legacy_tokens: true
  no_symlinks: true

steps:
  - name: "deploy"
    command: |
      deploy_workflow \
        --config {{ HOMEglobal }}/dev/parm/workflow/gcafs.yaml \
        --platform CONTAINER \
        --expdir {{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled \
        --version ci-{{ git_sha_short }}
    timeout: 180
    expect_success: true

  - name: "verify_post_gcafs"
    command: |
      grep -q "gcafs" {{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled/parm/ufs/post/post_itag
      echo "OK: GCAFS post_itag rendered"
    timeout: 30
    expect_success: true

  - name: "verify_nexus_submodule_copy"
    command: |
      test -d {{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled/parm/chem/nexus/gocart
      echo "OK: NEXUS GOCART configs copied verbatim"
    timeout: 30
    expect_success: true

  - name: "verify_no_legacy_tokens"
    command: |
      if grep -r '@\[' {{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled/parm/ 2>/dev/null; then
        echo "FATAL ERROR: Legacy @[VAR] tokens found"
        exit 1
      fi
      echo "OK: No legacy atparse tokens"
    timeout: 30
    expect_success: true

cleanup:
  - "rm -rf {{ RUNTESTS }}/EXPDIR/C96_gcafs_cycled"
