experiment:
  net: sfs
  mode: forecast-only
  idate: {{ 'DTG_GW' | getenv if ('DTG_GW' | getenv) != 'UNDEFINED' else 1994050100 }}
  edate: {{ 'DTG_GW' | getenv if ('DTG_GW' | getenv) != 'UNDEFINED' else 1994050100 }}
  pslot: {{ 'pslot' | getenv }}
  app: S2S
  resdetatmos: 192
  resensatmos: 192
  resdetocean: 0.25
  start: 'cold'
  nens: {{ 'NENS_GW' | getenv if ('NENS_GW' | getenv) != 'UNDEFINED' else 10 }}
  comroot: {{ 'RUNTESTS' | getenv }}/COMROOT
  expdir: "{{ 'EXPDIR_TOP' | getenv if ('EXPDIR_TOP' | getenv) != 'UNDEFINED' else ('RUNTESTS' | getenv) }}/EXPDIR"
  icsdir: {{ 'TOPICDIR' | getenv }}/CPC_landice/C192mx025
  yaml: {{ HOMEglobal }}/dev/ci/cases/yamls/sfs_full_C192mx025_CPC_ICS.yaml

workflow:
  engine: rocoto
  rocoto:
    maxtries: 2
    cyclethrottle: 3
    taskthrottle: 250
    verbosity: 2
