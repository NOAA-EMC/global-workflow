# =======================================
# Templates for CTests
# =======================================

include:
  - local: 'dev/ci/.gitlab-ci-hosts.yml'

# Setup job for ctests using CMake
.create_ctests:
  extends: .base_config
  stage: create_experiments
  script:
    - echo "Setting up for ctests workflow"
    - mkdir -p ${HOMEGFS}/ctests
    - cd ${HOMEGFS}/ctests
    - cmake ../..
    - echo "CTests have been created and configured successfully"
  dependencies:
    - build-${machine}
  tags:
    - ${machine}
  rules:
    - if: $GITHUB_API_TRIGGER == "true"

# Main template for CTest execution jobs
.run_ctests_template:
  extends: .base_config
  stage: run_tests
  allow_failure: true
  script:
    - echo "Running ${CTEST} tests in ${HOMEGFS}/ctests"
    - if [ "${PR_NUMBER}" != "0" ]; then
    -   echo "Testing PR #${PR_NUMBER}"
    - else
    -   echo "Testing standard branch"
    - fi
    - cd ${HOMEGFS}/ctests/build
    - ctest -R test_${CTEST}_setup
    - ctest -R test_${CTEST}_stage
    - ctest -R test_${CTEST}_execute
  dependencies:
    - create_ctests
  rules:
    - if: $GITHUB_API_TRIGGER == "true"
