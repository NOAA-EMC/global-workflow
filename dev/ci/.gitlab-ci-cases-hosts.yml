# Host-specific case configurations for the global-workflow project
# This file defines host-specific setup and test execution jobs

setup_experiments-hera:
  extends: .setup_template
  variables:
    machine: hera
  tags: ["hera"]
  parallel:
    matrix:
      - caseName: ["C48mx500_hybAOWCDA", "C96C48_hybatmDA", "C48_S2SWA_gefs", "C96C48_hybatmaerosnowDA", "C48_S2SW", "C96_atm3DVar", "C48_ATM", "C96mx100_S2S", "C48mx500_3DVarAOWCDA"]
  dependencies:
    - build-hera

run_tests-hera:
  extends: .run_tests_template
  variables:
    machine: hera
  tags: ["hera"]
  parallel:
    matrix:
      - caseName: ["C48mx500_hybAOWCDA", "C96C48_hybatmDA", "C48_S2SWA_gefs", "C96C48_hybatmaerosnowDA", "C48_S2SW", "C96_atm3DVar", "C48_ATM", "C96mx100_S2S", "C48mx500_3DVarAOWCDA"]
  dependencies:
    - setup_experiments-hera

