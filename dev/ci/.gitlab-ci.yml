# This file is used to define the GitLab CI/CD pipeline stages:
# building, setting up experiments, and running tests on different machines.
stages:
  - build
  - create_experiments
  - run_tests
  - finalize

variables:
  BUILD: ''
  CI_RUN_PATH: ${CI_BUILDS_DIR}/${BUILD}/${CI_COMMIT_SHORT_SHA}
  GIT_CLONE_PATH: '${CI_RUN_PATH}/global-workflow'
  HOMEGFS: ${GIT_CLONE_PATH}
  RUNTESTS_DIR: ${CI_RUN_PATH}/RUNTESTS
  GIT_DEPTH: 1
  RUNNER_SCRIPT_TIMEOUT: 6h
  RUNNER_AFTER_SCRIPT_TIMEOUT: 6h
  # GitHub API trigger detection - defaults to false
  GITHUB_API_TRIGGER: ${GITHUB_API_TRIGGER:-"false"}
  PR_NUMBER: ${PR_NUMBER:-"0"}

# Include ctests configuration for GitHub API triggered builds
include:
  - local: 'dev/ci/.gitlab-ci-ctests.yml'
    rules:
      - if: $GITHUB_API_TRIGGER == "true"

.base_config:
  variables:
    GIT_STRATEGY: none

.build_template:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  stage: build
  allow_failure: true
  script:
    - echo "Using build directory ${HOMEGFS}"
    - dev/ci/scripts/utils/ci_utils.sh build_compute
    - sorc/link_workflow.sh
    - mkdir -p ${RUNTESTS_DIR}
    # Add ctests build steps when triggered from GitHub API
    - |
      if [ "${GITHUB_API_TRIGGER}" == "true" ]; then
        echo "Setting up for ctests workflow"
        mkdir -p ${HOMEGFS}/ctests
        cd ${HOMEGFS}/ctests
        mkdir -p build
        cd build
        cmake ../..
      fi

.setup_template:
  extends: .base_config
  stage: create_experiments
  allow_failure: true
  script:
    - export RUNTESTS=${RUNTESTS_DIR}
    - ${HOMEGFS}/dev/ci/scripts/utils/ci_utils.sh create_experiment ${HOMEGFS}/dev/ci/cases/pr/${caseName}.yaml
  dependencies:
    - build-${machine}
  rules:
    - if: $GITHUB_API_TRIGGER != "true"

.run_tests_template:
  extends: .base_config
  stage: run_tests
  allow_failure: true
  script:
    - echo "Using build directory $HOMEGFS (dated $BUILD_DATE)"
    - pslot=$(${HOMEGFS}/dev/ci/scripts/utils/ci_utils.sh get_pslot ${RUNTESTS_DIR} ${caseName})
    - ${HOMEGFS}/dev/ci/scripts/run_check_ci.sh ${CI_RUN_PATH} ${pslot} global-workflow
  dependencies:
    - setup_experiments-${machine}
  rules:
    - if: $GITHUB_API_TRIGGER != "true"

.ctests_template:
  extends: .base_config
  stage: run_tests
  allow_failure: true
  script:
    - echo "Running ${CTEST} tests in ${HOMEGFS}/ctests"
    - if [ "${PR_NUMBER}" != "0" ]; then
    -   echo "Testing PR #${PR_NUMBER}"
    - else
    -   echo "Testing standard branch"
    - fi
    - cd ${HOMEGFS}/ctests/build
    - ctest -R test_${CTEST}_setup
    - ctest -R test_${CTEST}_stage
    - ctest -R test_${CTEST}_execute
  dependencies:
    - build-${machine}
  rules:
    - if: $GITHUB_API_TRIGGER == "true"

create_gist_from_svg_url:
  image: ghcr.io/cli/cli:latest
  stage: finalize
  allow_failure: true
  when: always
  script:
    - |
      # Set your SVG URL, output filename, and Gist ID
      SVG_URL="https://vlab.noaa.gov/gitlab-licensed/NWS/Operations/NCEP/EMC/global-workflow/badges/develop/pipeline.svg"
      SVG_FILE="badge.svg"
      GIST_ID="ab937691224bdf50427cbeca666bf67b"
      # Download the SVG (add authentication if needed)
      curl -L "$SVG_URL" -o "$SVG_FILE"
      # Authenticate GitHub CLI (requires GITHUB_TOKEN env variable)
      echo "$GITHUB_TOKEN" | gh auth login --with-token
      # Update the existing public Gist with the SVG file
      gh gist edit "$GIST_ID" "$SVG_FILE"
  variables:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

