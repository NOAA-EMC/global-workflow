# Traceability_Matrix (immutable-dag-goal-realization, Task 8 / Req 8)
#
# Maps every parent (immutable-dag-workflow-modernization) requirement
# (R1-R14) and every parent correctness Property (1-14) to its proving
# test(s) and the current pass status derived from the most recent
# Goal_Realization_Gate run.
#
# status values (Design "Data Models"): pending | pass | fail | unmapped
#   pending  - no gate run has recorded a result yet (initial value)
#   pass     - every mapped proving test passed in the latest gate run
#   fail     - at least one mapped proving test failed in the latest gate run
#   unmapped - the item has no proving test (Req 8.4 violation)
#
# Test identifiers are pytest paths relative to dev/workflow/ (the directory
# the gate runs pytest from). A "file.py::node" form pins a single test node.
#
# Consumed by: dev/workflow/deployment/traceability.py (load_traceability_matrix)
# Updated by:  goal_realization_gate.py / task 11 from the Verification_Report.
#
# NOTE on Properties 6 (Idempotence) and 7 (Statelessness): the parent design's
# illustrative PROPERTY_TESTS map named tests/test_idempotence_property.py and
# tests/test_statelessness_property.py, which do not exist in the suite. Those
# parent Properties trace to parent Req 5.4 (idempotence) and Req 5.3
# (statelessness), both exercised by the Universal_Wrapper ephemeral-execution
# tests. They are therefore mapped to the real proving test
# tests/test_universal_wrapper.py so the matrix maps only to tests that exist.
#
# LAST UPDATED: Goal_Realization_Gate run — all 14 Properties pass,
# 758 passed / 4 skipped / 0 failed / 0 errors / 0 collection errors.
# GateResult.realized = True.

