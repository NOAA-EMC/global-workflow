base:
  DO_JEDIATMVAR: "NO"
  DO_JEDIATMENS: "NO"
  DO_JEDIOCNVAR: "NO"
  DO_JEDISNOWDA: "NO"
  DO_MERGENSST: "NO"
  DO_BUFRSND: "NO"
  DO_GEMPAK: "NO"
  DO_AWIPS: "NO"
  KEEPDATA: "NO"
  DO_EXTRACTVARS: "NO"
  FCST_BREAKPOINTS: "48"
  FHMAX_HF_GFS: 0
  FHOUT_HF_GFS: 24
  FHMAX_GFS: 120
  FHOUT_GFS: 24
  FHOUT_OCN_GFS: 24
  FHOUT_ICE_GFS: 24
  HPSSARCH: "NO"
  LOCALARCH: "NO"
  USE_OCN_ENS_PERTURB_FILES: "NO"
  USE_ATM_ENS_PERTURB_FILES: "NO"
  DO_TEST_MODE: "NO"
  MOM6_INTERP_ICS: "NO"

  # Root of the fix file tree.  This default is the installation that
  # link_workflow.sh populates.  An experiment that customizes fix files with a
  # top-level `fix_files:` section has this rewritten by setup_expt.py to point at
  # the overlay it builds in EXPDIR, e.g.
  #
  #   fix_files:
  #     add:
  #       mom6/008/regional.mom6.nc: /path/to/my_experiment/regional.mom6.nc
  #
  # See docs/source/user_guide/setup.rst for the full syntax.
  FIXglobal: "${HOMEglobal}/fix"
fcst:
  CHECK_LAND_RESTART_OROG: "YES"
  reforecast: "YES"
  FHZERO: 24
  TYPE: "hydro"
  MONO: "mono"
nsst:
  NST_SPINUP: 0
# config.aero has just a system-specific path to add.
# This is handled by the setup_expt.py, but it has to be told to write to it.
aero: {}
