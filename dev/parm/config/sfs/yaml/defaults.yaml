base:
  DO_JEDIATMVAR: "NO"
  DO_JEDIATMENS: "NO"
  DO_JEDIOCNVAR: "NO"
  DO_JEDISNOWDA: "NO"
  DO_MERGENSST: "NO"
  DO_BUFRSND: "NO"
  DO_GEMPAK: "NO"
  DO_AWIPS: "NO"
  KEEPDATA: "NO"
  DO_EXTRACTVARS: "NO"
  FCST_BREAKPOINTS: "48"
  FHMAX_HF_GFS: 0
  FHOUT_HF_GFS: 24
  FHMAX_GFS: 120
  FHOUT_GFS: 24
  FHOUT_OCN_GFS: 24
  FHOUT_ICE_GFS: 24
  HPSSARCH: "NO"
  LOCALARCH: "NO"
  USE_OCN_ENS_PERTURB_FILES: "NO"
  USE_ATM_ENS_PERTURB_FILES: "NO"
  DO_TEST_MODE: "NO"
  MOM6_INTERP_ICS: "NO"
fcst:
  CHECK_LAND_RESTART_OROG: "YES"
  reforecast: "YES"
  FHZERO: 24
  TYPE: "hydro"
  MONO: "mono"
nsst:
  NST_SPINUP: 0
# config.aero has just a system-specific path to add.
# This is handled by the setup_expt.py, but it has to be told to write to it.
aero: {}

# MOM6 and CICE6 input templates.  These all default to the copies that
# link_workflow.sh stages under ${PARMglobal}/ufs and are listed here only for
# discoverability -- leave them unset to use the stock templates.
#
#   ocn:
#     MOM6_INPUT_TEMPLATE: /path/to/MOM_input_008.IN
#     MOM6_DATA_TABLE_TEMPLATE: /path/to/MOM6_data_table.IN
#   ice:
#     CICE_TEMPLATE: /path/to/ice_in.IN
#
# Each path is used as given, so a custom template can be named anything.  See
# docs/source/user_guide/configure.rst for the atparse tokens that a custom
# template has to keep.
