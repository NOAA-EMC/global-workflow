  FHMAX_HF_GFS: 0
  FHOUT_HF_GFS: 1
  FCST_BREAKPOINTS: "48"
  FHOUT_GFS: 6
  FHOUT_OCN_GFS: 24
  FHOUT_ICE_GFS: 24
