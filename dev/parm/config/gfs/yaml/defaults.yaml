atmanl:
  STATICB_TYPE: "gsibec"
  LAYOUT_X_ATMANL: 8
  LAYOUT_Y_ATMANL: 8
  IO_LAYOUT_X: 1
  IO_LAYOUT_Y: 1
  OBS_LIST_YAML: "${PARMglobal}/gdas/atm/atm_obs_list.yaml.j2"
  VAR_JEDI_TEST_YAML: ""
  FV3INC_JEDI_TEST_YAML: ""

atmensanl:
  LAYOUT_X_ATMENSANL: 8
  LAYOUT_Y_ATMENSANL: 8
  IO_LAYOUT_X: 1
  IO_LAYOUT_Y: 1
  OBS_LIST_YAML: "${PARMglobal}/gdas/atm/atm_obs_list.yaml.j2"
  LETKF_JEDI_TEST_YAML: ""
  OBS_JEDI_TEST_YAML: ""
  SOL_JEDI_TEST_YAML: ""
  FV3INC_JEDI_TEST_YAML: ""

aeroanl:
  IO_LAYOUT_X: 1
  IO_LAYOUT_Y: 1

snowanl:
  IO_LAYOUT_X: 1
  IO_LAYOUT_Y: 1

marinebmat:
  SOCA_INPUT_FIX_DIR: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_ANL_GEOM: "${FIXglobal}/gdas/soca/72x35x25/soca"

marineanl:
  SOCA_INPUT_FIX_DIR: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_ANL_GEOM: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_OBS_LIST: "${PARMglobal}/gdas/marine/obs/obs_list.yaml.j2"  # TODO: This is also repeated in oceanprepobs
  SOCA_NINNER: 100

marineanlecen:
  SOCA_INPUT_FIX_DIR: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_ANL_GEOM: "${FIXglobal}/gdas/soca/72x35x25/soca"

marineanlletkf:
  SOCA_INPUT_FIX_DIR: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_ANL_GEOM: "${FIXglobal}/gdas/soca/72x35x25/soca"
  SOCA_OBS_LIST: "${PARMglobal}/gdas/marine/obs/obs_list.yaml.j2"

prep:
  PROCESS_TROPCY: "NO"

prepoceanobs:
  use_exp_obs: "YES"
  dmpdir_exp: "${BASE_DATA}/experimental_obs"

fcst:
  CHECK_LAND_RESTART_FIELDS: "YES"

# config.aero has just a system-specific path to add.
# This is handled by the setup_expt.py, but it has to be told to write to it.
aero: {}

# MOM6 and CICE6 input templates.  These all default to the copies that
# link_workflow.sh stages under ${PARMglobal}/ufs and are listed here only for
# discoverability -- leave them unset to use the stock templates.
#
#   ocn:
#     MOM6_INPUT_TEMPLATE: /path/to/MOM_input_008.IN
#     MOM6_DATA_TABLE_TEMPLATE: /path/to/MOM6_data_table.IN
#   ice:
#     CICE_TEMPLATE: /path/to/ice_in.IN
#
# Each path is used as given, so a custom template can be named anything.  See
# docs/source/user_guide/configure.rst for additional information regarding the
# customization of these input files.
