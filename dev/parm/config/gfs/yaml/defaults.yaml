  DOENKFONLY_ATM: "NO"
  DO_JEDIATMVAR: "NO"
  DO_JEDIATMENS: "NO"
  DO_JEDIATMENS_SPLIT_OBSSOL: "YES"
  DO_JEDIOCNVAR: "NO"
  DO_JEDISNOWDA: "NO"
  DO_MERGENSST: "NO"
  DO_STARTMEM_FROM_JEDIICE: "NO"
  DO_GOES: "NO"
  DO_BUFRSND: "NO"
  DO_GEMPAK: "NO"
  DO_AWIPS: "NO"
  DO_NPOESS: "NO"
  DO_TRACKER: "YES"
  DO_GENESIS: "YES"
  DO_GENESIS_FSU: "NO"
  DO_METP: "YES"
  FHMAX_GFS: 120
  FHMAX_HF_GFS: 48
  FCST_BREAKPOINTS: ""
  DO_GSISOILDA: "NO"
  DO_LAND_IAU: ".false."
  EUPD_CYC: "gdas"
  FHMAX_ENKF_GFS: 12
  DOHYBVAR_OCN: "NO"
  DOLETKF_OCN: "NO"
  DOLETKF_OCN_INC: "NO"
  DO_TEST_MODE: "NO"
